<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .balls{
            height: 100vh;
            width: 100vw;
            background-color: rgb(0, 0, 0);
            display:flex;
            align-items:center;
            justify-content:center;
            gap: 12px;

            /* border: 5px solid red; */
        }
       
        .line{
            height: 100px;
            width: 600px;
            border-bottom: 10px solid rgb(110, 45, 23);
            position: relative;
            top: 0;
            left: -11%;
        }

        .circle {
            width: 50px;
            height: 50px;
            background-color: brown;
            border-radius: 50%;
            position: relative;
            top: 0;
            left: 20%;
            animation: bounce 1s linear infinite;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-150px);
            }

            100% {
                transform: translateY(0);
            }
        }
 
        .balls .circle:nth-child(1){
            animation-delay: 0.2s;
            background-color: rgb(151, 58, 194);
            filter: drop-shadow(2px 2px 10px rgb(196, 122, 202));
        }
        .balls .circle:nth-child(2){
            animation-delay: 0.4s;
            background-color: rgb(179, 91, 59);
        }
        .balls .circle:nth-child(3){
            animation-delay: 0.6s;
            background-color: rgb(24, 148, 113);
        }
        .balls .circle:nth-child(4){
            animation-delay: 0.8s;
            background-color: rgb(154, 23, 51);
        }
        .balls .circle:nth-child(5){
            animation-delay: 0.10s;
            background-color: rgb(172, 123, 17);
        }
       
    </style>
</head>

<body>
    <div class="balls">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="line"></div>
    </div>
</body>

</html>
